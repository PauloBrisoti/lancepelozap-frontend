<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LPZ Gestão" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Controle de Vendas e Finanças</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      var SWV = '3';
      if (localStorage.getItem('swv') !== SWV) {
        localStorage.setItem('swv', SWV);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(r) {
            r.forEach(function(reg) { reg.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(n) {
            n.forEach(function(name) { caches.delete(name); });
          });
        }
        setTimeout(function() { window.location.reload(); }, 300);
      }
    </script>
  </body>
</html>
